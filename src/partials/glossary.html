<div class="gloss" data-gloss>
  <div class="gloss-terms" role="group" aria-label="Choose a word">
    <button type="button" aria-pressed="true" data-def="Someone legally required to put your interests ahead of their own when they advise you." data-ours="We act as fiduciaries when we give investment advice. When Jake sells insurance he acts as an insurance agent, and we'll always tell you which role he's in.">Fiduciary</button>
    <button type="button" aria-pressed="false" data-def="The firm that actually holds your investments. It's separate from the adviser who manages them." data-ours="Ours is Charles Schwab. Your accounts are in your name there, not ours.">Custodian</button>
    <button type="button" aria-pressed="false" data-def="The total value of the investments an adviser manages for you, often shortened to AUM." data-ours="Our yearly fee is a percentage of this number, from 1.50% down to 0.75%.">Assets under management</button>
    <button type="button" aria-pressed="false" data-def="Moving money from a retirement plan, such as an old 401(k), into another plan or an IRA. Done directly, the move isn't taxed." data-ours="If you roll money into an account we manage, we earn a fee on it. We'll lay out every option first, including leaving it where it is.">Rollover</button>
    <button type="button" aria-pressed="false" data-def="A fund that owns every company in a market index, such as the S&P 500, instead of trying to pick winners. They usually cost less to own." data-ours="Most of what we invest in is low-cost index funds and ETFs.">Index fund</button>
    <button type="button" aria-pressed="false" data-def="Trimming what has grown and adding to what has lagged, so your mix of investments stays where you chose it." data-ours="We do this for you as part of managing your portfolio.">Rebalancing</button>
    <button type="button" aria-pressed="false" data-def="An adviser paid only by clients, never by commissions on products." data-ours="We aren't fee-only. Jake is a licensed insurance agent and may earn commissions on insurance he sells. That's a conflict of interest, and we disclose it.">Fee-only</button>
    <button type="button" aria-pressed="false" data-def="The disclosure document every registered investment adviser files with regulators. It covers fees, services, conflicts and background." data-ours="Ours is public on the SEC's adviser database under CRD 337684.">Form ADV</button>
  </div>
  <div class="gloss-def" aria-live="polite">
    <h3 data-gloss-title>Fiduciary</h3>
    <p data-gloss-text>Someone legally required to put your interests ahead of their own when they advise you.</p>
    <p class="ours" data-gloss-ours>We act as fiduciaries when we give investment advice. When Jake sells insurance he acts as an insurance agent, and we'll always tell you which role he's in.</p>
  </div>
</div>
